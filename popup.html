<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="Capture a bug from this tab or post a test report." />
        <title>QA Report</title>
        <link rel="stylesheet" href="ui.css" />
    </head>
    <body class="popup">
        <header class="bar">
            <span class="wordmark">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle class="dot" cx="12" cy="12" r="3.5" />
                </svg>
                QA Report
            </span>
            <div class="bar__end">
                <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch theme">
                    <svg class="when-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" /></svg>
                    <svg class="when-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                </button>
            </div>
        </header>
        <h1 class="visually-hidden">QA Report</h1>

        <main class="popup__body" id="setup" hidden>
            <p>Connect your Jira Cloud site once, then capture bugs from any tab.</p>
            <button type="button" class="btn btn--primary btn--block" id="openSetup">Connect Jira</button>
        </main>

        <main class="popup__body" id="ready" hidden>
            <p class="popup__site" id="site"></p>
            <button type="button" class="btn btn--primary btn--block" id="capture">Capture bug</button>
            <button type="button" class="btn btn--block" id="report">Post test report</button>
            <div class="popup__options">
                <label class="check">
                    <input type="checkbox" id="includeNetwork" />
                    <span>Record network traffic <small>Full requests as a HAR file, from now until you create the issue.</small></span>
                </label>
                <label class="check">
                    <input type="checkbox" id="includeVideo" />
                    <span>Record video <small>Start and stop it in the capture window.</small></span>
                </label>
            </div>
            <p class="notice notice--warn" id="devtoolsWarning" hidden>DevTools is open on this tab, so network traffic cannot be recorded. Close DevTools first.</p>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </main>

        <footer class="popup__foot">
            <a href="options.html" target="_blank">Settings</a>
            <span>Reopen window <kbd id="shortcut">Alt+Shift+B</kbd></span>
        </footer>
        <script src="theme.js" type="module"></script>
        <script src="popup.js" type="module"></script>
    </body>
</html>
