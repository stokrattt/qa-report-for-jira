<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Post a test report with evidence as a comment on a Jira issue." />
        <title>Test report</title>
        <link rel="stylesheet" href="ui.css" />
    </head>
    <body>
        <header class="bar">
            <span class="wordmark">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle class="dot" cx="12" cy="12" r="3.5" />
                </svg>
                QA Report
            </span>
            <span class="bar__title">Test report</span>
            <div class="bar__end">
                <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch theme">
                    <svg class="when-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" /></svg>
                    <svg class="when-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                </button>
                <button type="button" class="btn btn--primary" id="send">Post comment</button>
            </div>
        </header>

        <main class="page page--form">
            <h1 class="visually-hidden">Test report</h1>
            <div class="field">
                <label for="issueKey">Issue</label>
                <div class="key-row">
                    <input id="issueKey" class="input input--mono" name="issueKey" autocomplete="off" spellcheck="false" placeholder="ABC-123" />
                    <button type="button" class="btn" id="load">Load</button>
                </div>
                <p class="hint">Opened from a Jira issue, this fills itself.</p>
            </div>
            <div class="field">
                <label for="summary">Title</label>
                <input id="summary" class="input" name="summary" autocomplete="off" />
            </div>
            <div class="field">
                <label for="result" id="resultLabel">Result</label>
                <select id="result" class="select" name="result"></select>
            </div>
            <div id="templateFields" class="report-fields"></div>
            <p class="hint">Fields come from your report template. <a href="options.html#template" target="_blank">Edit the template</a></p>
            <div class="field">
                <span class="field__label" id="evidenceLabel">Evidence</span>
                <div class="drop" id="dropZone" aria-labelledby="evidenceLabel">
                    <p>Drop files here, paste a screenshot, or <button type="button" id="pickFiles">choose files</button>.</p>
                    <input type="file" id="fileInput" multiple hidden />
                </div>
                <ul class="files" id="fileList"></ul>
                <p class="hint">Images and videos show inline in the comment. Other files are linked.</p>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </main>
        <script src="theme.js" type="module"></script>
        <script src="report.js" type="module"></script>
    </body>
</html>
